<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chelth Rates + Pricing — Locked Interactive Reference</title>
<style>
:root{
  --canvas-w:1536;
  --canvas-h:1024;
  --panel-start:1187;
  --panel-width:349;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eef8f5}
body{display:grid;place-items:start center}
.prototype{
  position:relative;
  width:min(100vw,1536px);
  aspect-ratio:1536/1024;
  overflow:hidden;
  background:#f8fbfa;
}
.main-view{
  position:absolute;
  inset:0 auto 0 0;
  width:calc(var(--panel-start)/var(--canvas-w)*100%);
  overflow:hidden;
  transition:width .26s ease;
}
.prototype.panel-closed .main-view{width:100%}
.main-view img{
  position:absolute;
  inset:0 auto 0 0;
  width:calc(100%*var(--canvas-w)/var(--panel-start));
  height:100%;
  object-fit:fill;
  object-position:left top;
  max-width:none;
  user-select:none;
  pointer-events:none;
  transition:width .26s ease;
}
.prototype.panel-closed .main-view img{width:100%;object-fit:fill}

.detail-panel{
  position:absolute;
  top:0;right:0;
  width:calc(var(--panel-width)/var(--canvas-w)*100%);
  height:100%;
  overflow:hidden;
  z-index:20;
  transform:translateX(0);
  opacity:1;
  transition:transform .26s ease,opacity .18s ease;
  background:#f8fbfa;
}
.prototype.panel-closed .detail-panel{
  transform:translateX(100%);
  opacity:0;
  pointer-events:none;
}
.detail-panel img{
  position:absolute;
  top:0;
  left:calc(-1*var(--panel-start)/var(--panel-width)*100%);
  width:calc(var(--canvas-w)/var(--panel-width)*100%);
  height:100%;
  object-fit:fill;
  max-width:none;
  user-select:none;
  pointer-events:none;
}

.hotspot{
  position:absolute;
  z-index:40;
  border:0;
  margin:0;
  padding:0;
  background:transparent;
  cursor:pointer;
}
.hotspot:focus-visible{
  outline:3px solid rgba(18,107,103,.5);
  outline-offset:1px;
  border-radius:6px;
}

/* Drawer */
#closePanel{right:1.3%;top:11.4%;width:3%;height:4.2%}
#reopenPanel{right:0;top:9%;width:2.2%;height:82%;display:none}
.prototype.panel-closed #reopenPanel{display:block}

/* KPI cards */
.kpi{top:17.4%;height:11.3%}
#activeRates{left:16.5%;width:15.0%}
#missingRates{left:31.8%;width:15.0%}
#expiringSoon{left:47.1%;width:15.0%}
#rateExceptions{left:62.4%;width:13.8%}

/* Filters */
.filter{top:30.0%;height:4.4%}
#facilityFilter{left:16.5%;width:8.3%}
#roleFilter{left:25.0%;width:7.7%}
#typeFilter{left:33.0%;width:7.8%}
#statusFilter{left:41.0%;width:7.8%}
#effectiveDate{left:49.0%;width:8.0%}
#searchRates{left:57.2%;width:18.6%}

/* Export and Add */
#exportBtn{left:60.2%;top:36.2%;width:6.0%;height:3.4%}
#addRate{left:66.7%;top:36.2%;width:9.2%;height:3.4%}

/* Rate rows */
.row-hit{left:16.55%;width:59.4%;height:4.15%}
.row-hit.r1{top:45.6%}.row-hit.r2{top:49.75%}.row-hit.r3{top:53.9%}.row-hit.r4{top:58.05%}
.row-hit.r5{top:62.2%}.row-hit.r6{top:66.35%}.row-hit.r7{top:70.5%}.row-hit.r8{top:74.65%}

/* Pricing activity */
#viewAllActivity{left:68.3%;top:76.0%;width:7.4%;height:3.2%}
.activity{left:16.55%;width:59.4%;height:4.1%}
.activity.a1{top:81.8%}.activity.a2{top:85.9%}.activity.a3{top:90.0%}.activity.a4{top:94.1%}

/* Drawer */
#usageBlock{left:78.4%;top:47.5%;width:19.5%;height:12.7%}
#auditBlock{left:78.4%;top:60.0%;width:19.5%;height:20.7%}
#editRate{left:78.4%;top:84.2%;width:19.5%;height:4.2%}
#duplicateRate{left:78.4%;top:89.0%;width:9.5%;height:4.0%}
#deactivateRate{left:88.4%;top:89.0%;width:9.5%;height:4.0%}
#viewRelatedShifts{left:78.4%;top:93.8%;width:19.5%;height:4.0%}

.toast{
  position:absolute;
  left:50%;
  bottom:1.8%;
  transform:translateX(-50%) translateY(14px);
  z-index:60;
  padding:10px 14px;
  border-radius:8px;
  background:rgba(23,39,45,.94);
  color:#fff;
  font:600 12px/1.3 Inter,Arial,sans-serif;
  opacity:0;
  pointer-events:none;
  transition:.18s ease;
  box-shadow:0 8px 20px rgba(0,0,0,.14);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){
  .main-view,.main-view img,.detail-panel,.toast{transition:none}
}
</style>
</head>
<body>
<main class="prototype" id="prototype" aria-label="Chelth Rates and Pricing locked interaction reference">
  <div class="main-view"><img src="assets/chelth-rates-pricing-locked.png" alt="Chelth Rates and Pricing dashboard"></div>
  <aside class="detail-panel" id="detailPanel" aria-label="Rate Details panel"><img src="assets/chelth-rates-pricing-locked.png" alt=""></aside>

  <button id="closePanel" class="hotspot" type="button" aria-label="Close rate details"></button>
  <button id="reopenPanel" class="hotspot" type="button" aria-label="Reopen rate details"></button>

  <button id="activeRates" class="hotspot kpi" data-action="Filter: Active Rate Cards"></button>
  <button id="missingRates" class="hotspot kpi" data-action="Filter: Missing Rates"></button>
  <button id="expiringSoon" class="hotspot kpi" data-action="Filter: Expiring Soon"></button>
  <button id="rateExceptions" class="hotspot kpi" data-action="Filter: Rate Exceptions"></button>

  <button id="facilityFilter" class="hotspot filter" data-action="Filter rates by facility"></button>
  <button id="roleFilter" class="hotspot filter" data-action="Filter rates by role"></button>
  <button id="typeFilter" class="hotspot filter" data-action="Filter by rate type"></button>
  <button id="statusFilter" class="hotspot filter" data-action="Filter by status"></button>
  <button id="effectiveDate" class="hotspot filter" data-action="Filter by effective date"></button>
  <button id="searchRates" class="hotspot filter" data-action="Search rate cards"></button>

  <button id="exportBtn" class="hotspot" data-action="Export current rate-card view"></button>
  <button id="addRate" class="hotspot" data-action="Open Add Rate Card flow"></button>

  <button class="hotspot row-hit r1" data-action="Open rate details"></button>
  <button class="hotspot row-hit r2" data-action="Open rate details"></button>
  <button class="hotspot row-hit r3" data-action="Open rate details"></button>
  <button class="hotspot row-hit r4" data-action="Open rate details"></button>
  <button class="hotspot row-hit r5" data-action="Open rate details"></button>
  <button class="hotspot row-hit r6" data-action="Open rate details"></button>
  <button class="hotspot row-hit r7" data-action="Open rate details"></button>
  <button class="hotspot row-hit r8" data-action="Open rate details"></button>

  <button id="viewAllActivity" class="hotspot" data-action="View all pricing activity"></button>
  <button class="hotspot activity a1" data-action="Open pricing activity"></button>
  <button class="hotspot activity a2" data-action="Open pricing activity"></button>
  <button class="hotspot activity a3" data-action="Open pricing activity"></button>
  <button class="hotspot activity a4" data-action="Open pricing activity"></button>

  <button id="usageBlock" class="hotspot" data-action="Review usage and related data"></button>
  <button id="auditBlock" class="hotspot" data-action="Review rate audit history"></button>
  <button id="editRate" class="hotspot" data-action="Edit selected rate"></button>
  <button id="duplicateRate" class="hotspot" data-action="Duplicate selected rate"></button>
  <button id="deactivateRate" class="hotspot" data-action="Deactivate selected rate"></button>
  <button id="viewRelatedShifts" class="hotspot" data-action="View shifts using selected rate"></button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<script>
(() => {
  const root = document.getElementById('prototype');
  const panel = document.getElementById('detailPanel');
  const toast = document.getElementById('toast');
  let timer;

  function openPanel(){
    root.classList.remove('panel-closed');
    panel.setAttribute('aria-hidden','false');
  }
  function closePanel(){
    root.classList.add('panel-closed');
    panel.setAttribute('aria-hidden','true');
  }
  function feedback(message){
    clearTimeout(timer);
    toast.textContent = message;
    toast.classList.add('show');
    timer = setTimeout(()=>toast.classList.remove('show'),1400);
  }

  document.getElementById('closePanel').addEventListener('click',closePanel);
  document.getElementById('reopenPanel').addEventListener('click',openPanel);

  document.querySelectorAll('.row-hit,.activity').forEach(el=>{
    el.addEventListener('click',()=>{openPanel();feedback(el.dataset.action);});
  });

  document.querySelectorAll('[data-action]').forEach(el=>{
    if(el.classList.contains('row-hit') || el.classList.contains('activity')) return;
    el.addEventListener('click',()=>feedback(el.dataset.action));
  });

  root.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
})();
</script>
</body>
</html>
