# Chelth CI — verifies quality. Deployment is handled by the Vercel Git
# integration; this workflow never deploys and holds no production secrets.
#
# Supabase-backed jobs run a LOCAL, ephemeral stack inside the runner. Its
# keys are the CLI's non-secret local development keys, exported by
# scripts/local-supabase-env.mjs (anon key only — never service-role).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  SUPABASE_CLI_VERSION: 2.109.0

jobs:
  quality:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Non-secret placeholders: the build must pass environment validation
      # without talking to any Supabase project.
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Client bundle secret scan
        run: npm run check:bundle

  database:
    name: Migrations, database security tests, integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migration discipline
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-migrations.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/check-migrations.mjs
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase (applies every migration from an empty database)
        run: supabase start -x analytics,vector,studio,imgproxy,edge-runtime,functions,realtime,meta
      - name: Lint database schema
        run: supabase db lint --level warning --fail-on warning --schema public,authz,internal
      - name: pgTAP security tests
        run: supabase test db
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          diff -u src/types/database.types.ts /tmp/database.types.ts
      - name: Export local stack environment
        run: node scripts/local-supabase-env.mjs >> "$GITHUB_ENV"
      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: Playwright (production build against local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase (auth, API, Mailpit)
        run: supabase start -x analytics,vector,studio,imgproxy,edge-runtime,functions,realtime,meta,storage
      - name: Export local stack environment
        run: node scripts/local-supabase-env.mjs >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
